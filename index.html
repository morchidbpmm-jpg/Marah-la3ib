<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرحبا بكم في موقع لينا</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff6fb;--card:#ffffff;--text:#3a2140;--muted:#7a6580;--accent:#d63384;--accent2:#7c3aed;--border:#f0d5e6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b1220;--card:#271a2e;--text:#f6e9fa;--muted:#b9a3c2;--accent:#ff6db3;--accent2:#a78bfa;--border:#3d2a47}}
:root[data-theme="dark"]{--bg:#1b1220;--card:#271a2e;--text:#f6e9fa;--muted:#b9a3c2;--accent:#ff6db3;--accent2:#a78bfa;--border:#3d2a47}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",Arial,sans-serif;line-height:1.8}
main{max-width:560px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:1.7rem;text-align:center;margin:8px 0}
.sub{text-align:center;color:var(--muted);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:18px}
h2{font-size:1.15rem;margin:0 0 8px}
p{margin:0 0 14px}
.btn{display:block;width:100%;text-align:center;border:0;border-radius:14px;padding:14px;font-size:1.05rem;font-family:inherit;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;text-decoration:none}
textarea,input{width:100%;font-family:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:12px}
textarea{min-height:110px;resize:vertical}
.note{font-size:.85rem;color:var(--muted);margin:10px 0 0}
#status{margin-top:12px;text-align:center;color:var(--accent2);min-height:1.5em}
</style>
</head>
<body>
<main>
  <h1>🌸 مرحبا بكم في موقع لينا</h1>
  <p class="sub">أهلاً بكم في عالم لعبتي</p>

  <section class="card">
    <h2>🎮 جرّبوا لعبتي</h2>
    <p>إذا أردتم تجربة لعبتي، حمّلوها من هنا:</p>
    <a id="dl" class="btn" href="#" download>تحميل الآن</a>
    <p class="note">ملف APK لأجهزة أندرويد. قد تحتاجون للسماح بالتثبيت من مصادر غير معروفة.</p>
  </section>

  <section class="card">
    <h2>💌 ادعموني برسالة</h2>
    <p>يرجى كتابة رسالة دعم لي:</p>
    <input id="name" type="text" placeholder="اسمك (اختياري)" maxlength="60">
    <textarea id="msg" placeholder="اكتب رسالتك هنا..." maxlength="1000"></textarea>
    <button id="send" class="btn" type="button">حفظ الرسالة</button>
    <div id="status"></div>
    <p class="note">تُحفظ رسالتك على جهازك فقط ولا تُرسل إلى أي جهة.</p>
  </section>
</main>

var dl = document.getElementById("dl");
var st0 = document.getElementById("status");
dl.addEventListener("click", function(e){
  e.preventDefault();
  try {
    var bin = atob(APK_B64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], {type: "application/vnd.android.package-archive"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "لعبة_المرح.apk";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    st0.textContent = "بدأ التحميل 🎉";
  } catch (err) { st0.textContent = "تعذّر التحميل، حاول مرة أخرى"; }
});

var msg = document.getElementById("msg"), nameEl = document.getElementById("name"), st = document.getElementById("status");
try {
  var saved = JSON.parse(localStorage.getItem("lina_support") || "null");
  if (saved) { msg.value = saved.msg || ""; nameEl.value = saved.name || ""; }
} catch (e) {}

document.getElementById("send").addEventListener("click", function(){
  if (!msg.value.trim()) { st.textContent = "اكتب رسالة أولاً"; return; }
  try {
    localStorage.setItem("lina_support", JSON.stringify({name: nameEl.value, msg: msg.value, t: Date.now()}));
    st.textContent = "شكراً لك 💖 تم حفظ رسالتك على جهازك";
  } catch (e) { st.textContent = "تعذّر الحفظ على هذا المتصفح"; }
});
